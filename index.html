  --hero:#0B2A66; --hero-ink:#EEF3FC; --hero-muted:#B3C5E6;
  --danger:#B3261E; --danger-ink:#FFFFFF;
  --c-fin:#FFF0C7; --c-fin-ink:#6A4800;
  --c-soc:#DDF1E8; --c-soc-ink:#0B5A40;
  --c-cli:#E1E9FB; --c-cli-ink:#233A8F;
  --c-par:#F1E3F5; --c-par-ink:#6B2A7E;
  --shadow:0 1px 2px rgba(14,31,27,.06),0 10px 28px rgba(14,31,27,.08);
  --f-display:'Sora',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1224; --surface:#101B35; --surface2:#16254A; --ink:#E8EEFB; --muted:#9FB0D3; --line:#24365F;
    --accent:#3CC9D6; --accent-ink:#04252B; --accent-soft:#12355A; --gold:#F2B93B;
    --hero:#0F2B63; --hero-ink:#EEF3FC; --hero-muted:#B3C5E6;
    --danger:#FF8B84; --danger-ink:#2A0A08;
    --c-fin:#3A2E0A; --c-fin-ink:#F5D27A;
    --c-soc:#14382E; --c-soc-ink:#7FE3BF;
    --c-cli:#1E2A55; --c-cli-ink:#A9BBFF;
    --c-par:#3A1F44; --c-par-ink:#E2B3F0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1224; --surface:#101B35; --surface2:#16254A; --ink:#E8EEFB; --muted:#9FB0D3; --line:#24365F;
  --accent:#3CC9D6; --accent-ink:#04252B; --accent-soft:#12355A; --gold:#F2B93B;
  --hero:#0F2B63; --hero-ink:#EEF3FC; --hero-muted:#B3C5E6;
  --danger:#FF8B84; --danger-ink:#2A0A08;
  --c-fin:#3A2E0A; --c-fin-ink:#F5D27A;
  --c-soc:#14382E; --c-soc-ink:#7FE3BF;
  --c-cli:#1E2A55; --c-cli-ink:#A9BBFF;
  --c-par:#3A1F44; --c-par-ink:#E2B3F0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-block:8px 48px;padding-inline:clamp(16px,4vw,32px)}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;display:block;flex:none}
.h{font-family:var(--f-display);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}

/* cabeçalho */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.hdr-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:10px 14px}
.logo-btn{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em}
.logo-btn img{width:42px;height:42px;border-radius:12px;object-fit:contain;background:#fff;padding:3px;border:1px solid var(--line)}
.wm b{color:var(--ink);font-weight:700}
.wm i{font-style:normal;color:var(--accent);font-weight:700}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-muted)}
.nav{display:flex;gap:2px;order:3;width:100%;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.nl{padding:7px 14px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--muted);position:relative;display:inline-flex;align-items:center;gap:8px}
.nl:hover{background:var(--surface2);color:var(--ink)}
.nl[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nb{min-width:19px;height:19px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}
.hdr-cta{margin-left:auto}
@media (min-width:720px){
  .nav{order:0;width:auto;border-top:0;padding-top:0;margin-top:0;margin-left:10px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--danger);color:var(--danger-ink);border-color:transparent}
.btn.full{width:100%}
.linkbtn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}
.linkbtn:hover{color:var(--ink)}
.linkbtn.warn:hover{color:var(--danger)}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:clamp(24px,5vw,44px) clamp(20px,4vw,40px);margin-top:16px;display:flex;flex-direction:column;gap:20px}
.hero>*{position:relative;z-index:1}
.hero-art{position:absolute!important;right:0;top:0;bottom:0;width:60%;height:100%;opacity:.55;pointer-events:none;z-index:0!important;-webkit-mask-image:linear-gradient(to left,#000 5%,transparent 92%);mask-image:linear-gradient(to left,#000 5%,transparent 92%)}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5.4vw,48px);line-height:1.08;letter-spacing:-.03em;max-width:17ch;text-wrap:balance}
.hero p.lead{color:var(--hero-muted);max-width:50ch;font-size:16.5px}
.search{display:flex;gap:6px;background:var(--surface);border-radius:14px;padding:6px;max-width:580px;color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:8px 10px}
.search input:focus-visible{outline:none}
.search:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px 36px}
.hero-stats b{font-family:var(--f-display);font-size:26px;display:block;line-height:1.1}
.hero-stats span{font-size:13px;color:var(--hero-muted)}

/* filtros */
.filters{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.sect{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--muted)}
.sect i{width:9px;height:9px;border-radius:50%;background:var(--sc,var(--muted))}
.sect:hover{color:var(--ink);border-color:var(--muted)}
.sect[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.in,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
select.sm{width:auto;max-width:100%;padding:8px 12px;font-size:14px;font-weight:600}
.tog{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;font-weight:600;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.resbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:22px 0 12px}
.resbar p{font-family:var(--f-display);font-weight:600;font-size:18px}

/* cartões */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.bcard{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease}
.bcard:hover{transform:translateY(-3px);border-color:var(--muted)}
.bcard.pv:hover{transform:none;border-color:var(--line)}
.cover{position:relative;height:108px}
.cover svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.save{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#10231F}
.save[aria-pressed="true"]{background:var(--gold);color:#1A1200}
.save[aria-pressed="true"] svg{fill:currentColor}
.newtag{position:absolute;top:12px;left:12px;background:var(--gold);color:#1A1200;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.bbody{padding:0 18px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.logo{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;background:#fff;border:3px solid var(--surface);box-shadow:0 2px 8px rgba(14,31,27,.18);font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;margin-top:-28px;position:relative;flex:none}
.logo.lg{width:84px;height:84px;font-size:28px;border-radius:20px;margin-top:0}
.logo.sm{width:44px;height:44px;font-size:15px;border-radius:12px;margin-top:0;border-width:2px;box-shadow:none;border-color:var(--line)}
.bt{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.015em;display:flex;align-items:center;gap:6px;line-height:1.2}
.stretch::after{content:"";position:absolute;inset:0;z-index:1}
.vchk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);flex:none}
.vchk svg{width:12px;height:12px}
.pend{font-family:var(--f-body);font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--c-fin);color:var(--c-fin-ink)}
.lvl{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.bars{display:inline-flex;gap:3px;flex:none}
.bars i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.bars i.on{background:var(--accent)}
.bars.l4 i.on{background:var(--gold)}
.how{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.how summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"+";font-size:22px;color:var(--accent);line-height:1}
.how[open] summary::after{content:"\2013"}
.how summary small{display:block;font-weight:500;color:var(--muted);font-size:13.5px}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;padding:0 18px 18px}
.step{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.step b{font-family:var(--f-display);font-size:15px}
.step p{font-size:13.5px;color:var(--muted)}
.rungs{display:flex;flex-direction:column;gap:12px}
.rung{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.rung>i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
.rung.on>i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rung>i svg{width:11px;height:11px}
.rung span{display:block;color:var(--muted);font-size:13.5px}
.rung b{display:block;color:var(--ink)}
.note{border-radius:12px;padding:10px 12px;background:var(--c-fin);color:var(--c-fin-ink);font-size:13.5px;font-weight:600}
.meta{font-size:13.5px;color:var(--muted)}
.tagline{font-size:14.5px}
.seeks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700}
.k-financiamento{background:var(--c-fin);color:var(--c-fin-ink)}
.k-socio{background:var(--c-soc);color:var(--c-soc-ink)}
.k-clientes{background:var(--c-cli);color:var(--c-cli-ink)}
.k-parceiros{background:var(--c-par);color:var(--c-par-ink)}
.bfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;border-top:1px solid var(--line);padding:10px 18px;font-size:12.5px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;border:1px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-family:var(--f-display);font-size:20px}
.empty p{color:var(--muted);max-width:40ch}

/* detalhe */
.crumb{margin:20px 0 12px}
.dhero{position:relative;margin-bottom:24px}
.dcover{position:relative;height:clamp(130px,22vw,200px);border-radius:22px;overflow:hidden}
.dcover svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dtitle{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin:-42px 20px 0;position:relative}
.dt{padding-top:46px;min-width:0;flex:1 1 260px}
.dt h1{font-family:var(--f-display);font-size:clamp(24px,4vw,34px);letter-spacing:-.025em;line-height:1.1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
@media (min-width:900px){.dgrid{grid-template-columns:minmax(0,1fr) 340px}.dside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}}
.dmain{display:flex;flex-direction:column;gap:28px;min-width:0}
.dtag{font-family:var(--f-display);font-size:clamp(20px,3vw,26px);line-height:1.25;letter-spacing:-.02em;font-weight:600;text-wrap:balance;max-width:30ch}
.about{max-width:68ch;font-size:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.fact{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px}
.fact b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.15}
.fact span{font-size:13px;color:var(--muted)}
.seekcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.sc{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sc .amt{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sc .amt small{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0;margin-bottom:2px}
.sc p{font-size:14.5px}
.dside{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-family:var(--f-display);font-size:16px}
.panel p,.panel li{font-size:14px;color:var(--muted)}
.panel ul{display:flex;flex-direction:column;gap:7px;padding-left:18px;list-style:disc}
.owner{display:flex;align-items:center;gap:12px}
.owner b{display:block;font-weight:700}
.owner span{font-size:13px;color:var(--muted)}
.wa{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wa small{display:block;font-size:12px;color:var(--muted)}
.wa b{font-variant-numeric:tabular-nums;user-select:all}
.wa button{font-weight:700;font-size:13.5px;color:var(--accent);padding:4px 8px}

/* publicar */
.pubgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
@media (min-width:960px){.pubgrid{grid-template-columns:minmax(0,1fr) 340px}.pubprev{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}}
.formp{padding:clamp(18px,3vw,28px);gap:18px}
.formp h1{font-family:var(--f-display);font-size:clamp(24px,3.4vw,32px);letter-spacing:-.025em;line-height:1.1;color:var(--ink)}
.formp .lead{font-size:15px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.l{font-size:13.5px;font-weight:700;color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.count{font-size:12px;color:var(--muted);align-self:flex-end}
.sk{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;cursor:pointer}
.chk input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.skf{display:flex;flex-direction:column;gap:8px}
.err{color:var(--danger);font-size:14px;font-weight:600}
.pubprev{display:flex;flex-direction:column;gap:12px;min-width:0}

/* mensagens */
.msgwrap{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden;height:clamp(480px,72vh,680px);margin-top:20px;box-shadow:var(--shadow)}
.tlist{border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.tlist .th{padding:16px 16px 10px;font-family:var(--f-display);font-weight:700;font-size:18px}
.thread{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%}
.thread:hover{background:var(--surface2)}
.thread[aria-current="true"]{background:var(--accent-soft)}
.thread .t{min-width:0;flex:1}
.thread .n{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14.5px}
.thread .n time{font-size:12px;font-weight:500;color:var(--muted)}
.thread .p{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread.unread .p{color:var(--ink);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.cpane{display:flex;flex-direction:column;min-width:0;min-height:0}
.chead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chead .who{min-width:0;flex:1;line-height:1.25}
.chead .who b{display:block;font-family:var(--f-display);font-size:16px}
.chead .who span{font-size:13px;color:var(--muted)}
.backbtn{display:none;width:38px;height:38px;border-radius:50%;place-items:center}
.backbtn:hover{background:var(--surface2)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:9px 13px;border-radius:16px;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.b.them{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:4px}
.b time{display:block;font-size:11px;opacity:.72;margin-top:2px}
.typing{align-self:flex-start;color:var(--muted);font-size:13px}
.ice{margin:auto 0;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;padding:12px}
.ice p{color:var(--muted);max-width:36ch}
.icechips{display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px}
.icechips button{padding:10px 14px;border:1px dashed var(--line);border-radius:14px;font-size:14px;background:var(--surface2)}
.icechips button:hover{border-color:var(--accent)}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer input{flex:1;border-radius:99px;padding-inline:16px}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.cph{margin:auto;text-align:center;color:var(--muted);padding:24px}
@media (max-width:760px){
  .msgwrap{grid-template-columns:minmax(0,1fr)}
  .msgwrap.has-active .tlist{display:none}
  .msgwrap:not(.has-active) .cpane{display:none}
  .backbtn{display:grid}
}

/* camadas */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,16,13,.6);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:600px){.overlay{align-items:center;padding:16px}}
.sheet{width:100%;max-width:460px;background:var(--surface);border-radius:22px 22px 0 0;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto}
@media (min-width:600px){.sheet{border-radius:22px}}
.sheet h2{font-family:var(--f-display);font-size:20px;line-height:1.2}
.sheet .muted{color:var(--muted);font-size:14px}
.sheet fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14.5px}
.opt input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1 1 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;width:min(520px,calc(100% - 32px));display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:14px;font-size:14.5px;box-shadow:var(--shadow)}
.toast button{font-weight:700;color:var(--gold);flex:none;padding:2px 6px}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){.bcard{transition:none}}
</style>

function list(){

  if(f.seek!=='todos')r=r.filter(function(b){return b.seeks.some(function(s){return s.t===f.seek})});
  if(f.saved)r=r.filter(function(b){return S.saved.has(b.id)});
  if(f.level>1)r=r.filter(function(b){return b.level>=f.level});

var unsubs=[],threadsLoaded=false;
function stopListeners(){unsubs.forEach(function(f){f()});unsubs=[];if(unsubMsgs){unsubMsgs();unsubMsgs=null}watching=null;threadsLoaded=false}
function startListeners(){
  var uid=S.user.uid;
  unsubs.push(onSnapshot(collection(db,'users',uid,'saved'),function(s){S.saved=new Set(s.docs.map(function(d){return d.id}));refreshSaved()},function(){}));
  unsubs.push(onSnapshot(query(collection(db,'threads'),where('participants','array-contains',uid)),onThreads,function(){}));

function onThreads(snap){
  var uid=S.user.uid,first=!threadsLoaded,ids={},live=S.view==='messages';threadsLoaded=true;
  snap.docs.forEach(function(d){
    var x=d.data({serverTimestamps:'estimate'}),id=d.id;ids[id]=1;
    var th=S.threads[id]||(S.threads[id]={msgs:[]}),prev=th.last||0;
    th.draft=false;th.bizId=x.bizId;th.buyerId=x.buyerId;th.buyerName=String(x.buyerName||'');th.mine=x.buyerId!==uid;
    th.lastText=String(x.lastText||'');th.lastFrom=x.lastFrom||'';th.last=x.lastMessageAt&&x.lastMessageAt.toMillis?x.lastMessageAt.toMillis():Date.now();
    var incoming=th.lastFrom&&th.lastFrom!==uid,open=live&&S.active===id;
    if(open){th.unread=0;seen[id]=th.last}else th.unread=(incoming&&th.last>(seen[id]||0))?1:0;
    if(!first&&incoming&&th.last>prev&&!open)toast(contactOf(id).name+' enviou-te uma mensagem.',{label:'Abrir',fn:function(){openThread(id,th.bizId)}});
  });
  store.set('sb_seen',seen);
  Object.keys(S.threads).forEach(function(k){if(!ids[k]&&!S.threads[k].draft)delete S.threads[k]});
  var keys=Object.keys(S.threads);
  S.order=keys.filter(function(k){return S.threads[k].draft}).concat(keys.filter(function(k){return !S.threads[k].draft}).sort(function(a,b){return S.threads[b].last-S.threads[a].last}));
  if(S.active&&!S.threads[S.active])S.active=null;
  updateHeader();
  if(S.view==='messages'){
    var inp=$('#msgInput'),val=inp?inp.value:'',foc=inp&&document.activeElement===inp;
    renderMessages();
    if(val){var n=$('#msgInput');if(n){n.value=val;if(foc)n.focus()}}
  }
}

var L={step:'phone',busy:false,err:'',info:'',email:'',signup:false,phoneRaw:'',phone:'',conf:null,verifier:null,after:null,open:false};
function normPhone(v){
  var s=String(v).replace(/[\s().-]/g,'');
  if(/^00/.test(s))s='+'+s.slice(2);
  else if(/^\+/.test(s)){}
  else if(/^258\d{9}$/.test(s))s='+'+s;
  else if(/^8\d{8}$/.test(s))s='+258'+s;
  else return '';
  return /^\+\d{8,15}$/.test(s)?s:'';
}
function authMsg(e){
  var c=e&&e.code||'';
  return {'auth/invalid-phone-number':'O número não é válido. Confirma e tenta de novo.','auth/too-many-requests':'Muitas tentativas. Espera alguns minutos e tenta de novo.',
    'auth/invalid-verification-code':'O código está errado. Confirma o SMS e tenta de novo.','auth/code-expired':'O código expirou. Pede um novo.',
    'auth/captcha-check-failed':'Não foi possível confirmar que és uma pessoa. Recarrega a página e tenta de novo.','auth/operation-not-allowed':'A entrada por telefone ainda não está ativa neste projeto.',
    'auth/quota-exceeded':'Foi atingido o limite de SMS. Tenta mais tarde.','auth/network-request-failed':'Sem ligação à internet. Tenta de novo.',
    'auth/invalid-email':'O email não é válido.','auth/email-already-in-use':'Já existe uma conta com este email. Usa "Já tenho conta".','auth/weak-password':'A palavra-passe é fraca. Usa pelo menos 6 caracteres.',
    'auth/invalid-credential':'Email ou palavra-passe errados.','auth/wrong-password':'Email ou palavra-passe errados.','auth/user-not-found':'Email ou palavra-passe errados.'}[c]||'Não foi possível continuar. Tenta de novo.';
}
function showLogin(step){L.step=step||(AUTH_MODE==='phone'?'phone':'email');L.err='';L.info='';L.busy=false;drawLogin()}
function drawLogin(){
  var l=$('#layer'),h,label,focusId;
  if(L.step==='email'){focusId='lEmail';label=L.signup?'Criar conta':'Entrar';
    h='<h2>'+(L.signup?'Criar conta na SpotBiz':'Entrar na SpotBiz')+'</h2><div class="seg" role="group" aria-label="Tipo de acesso" style="margin-bottom:14px;width:100%"><button type="button" data-act="authtab" data-v="in" aria-pressed="'+(!L.signup)+'" style="flex:1;padding:10px">Já tenho conta</button><button type="button" data-act="authtab" data-v="up" aria-pressed="'+L.signup+'" style="flex:1;padding:10px">Criar conta</button></div><p class="muted">'+(L.signup?'Usa um email que consultes. A palavra-passe tem pelo menos 6 caracteres.':'Entra com o teu email e a tua palavra-passe.')+'</p><div class="fld"><label for="lEmail">Email</label><input class="in" id="lEmail" type="email" autocomplete="email" value="'+esc(L.email)+'"></div><div class="fld"><label for="lPass">Palavra-passe</label><input class="in" id="lPass" type="password" autocomplete="'+(L.signup?'new-password':'current-password')+'"></div>'+(L.signup?'':'<p style="font-size:14px"><button type="button" class="linkbtn" data-act="resetpw">Esqueci a palavra-passe</button></p>');
  }else if(L.step==='phone'){focusId='lPhone';label='Receber código';
    h='<h2>Entrar na SpotBiz</h2><p class="muted">Enviamos um código por SMS para confirmar o teu número. Não precisas de palavra-passe.</p><div class="fld"><label for="lPhone">O teu número de telemóvel</label><input class="in" id="lPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="84 123 4567" value="'+esc(L.phoneRaw)+'"></div>';
  }else if(L.step==='code'){focusId='lCode';label='Confirmar';
    h='<h2>Escreve o código</h2><p class="muted">Enviámos um SMS para '+esc(L.phone)+'.</p><div class="fld"><label for="lCode">Código de 6 dígitos</label><input class="in" id="lCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>';
  }else{focusId='lName';label='Continuar';
    h='<h2>Como te chamas?</h2><p class="muted">Este nome aparece nas mensagens que enviares.</p><div class="fld"><label for="lName">O teu nome</label><input class="in" id="lName" maxlength="40" autocomplete="name"></div>';
  }
  l.innerHTML='<form class="sheet" id="loginForm" novalidate role="dialog" aria-modal="true" aria-label="Entrar">'+h+(L.info?'<p class="muted" id="lInfo">'+esc(L.info)+'</p>':'')+'<p class="err" id="lErr"'+(L.err?'':' hidden')+'>'+esc(L.err)+'</p><div class="btnrow"><button class="btn primary" type="submit"'+(L.busy?' disabled':'')+'>'+(L.busy?'Um momento…':label)+'</button><button class="btn" type="button" data-act="closeLayer">Cancelar</button></div></form>';
  l.hidden=false;L.open=true;var f=$('#'+focusId);if(f)f.focus();
}
function loginFail(e){L.busy=false;L.err=authMsg(e);if(e&&e.code&&/captcha|too-many|quota|network/.test(e.code))resetVerifier();drawLogin()}
function resetVerifier(){try{if(L.verifier)L.verifier.clear()}catch(e){}L.verifier=null}
function submitLogin(){
  if(L.busy)return;
  if(L.step==='email'){
    var em=$('#lEmail').value.trim(),pw=$('#lPass').value;L.email=em;L.info='';
    if(!/^\S+@\S+\.\S+$/.test(em)){L.err='Escreve um email válido.';drawLogin();return}
    if(pw.length<6){L.err='A palavra-passe tem pelo menos 6 caracteres.';drawLogin();return}
    L.busy=true;L.err='';drawLogin();
    (L.signup?createUserWithEmailAndPassword(auth,em,pw):signInWithEmailAndPassword(auth,em,pw)).catch(loginFail);
  }else if(L.step==='phone'){
    L.phoneRaw=$('#lPhone').value;var p=normPhone(L.phoneRaw);
    if(!p){L.err='Escreve um número válido, por exemplo 84 123 4567.';drawLogin();return}
    L.busy=true;L.err='';drawLogin();
    resetVerifier();
    try{L.verifier=new RecaptchaVerifier(auth,'recaptcha',{size:'invisible'})}catch(e){loginFail(e);return}
    signInWithPhoneNumber(auth,p,L.verifier).then(function(c){L.conf=c;L.phone=p;L.step='code';L.busy=false;L.err='';drawLogin()}).catch(function(e){resetVerifier();loginFail(e)});
  }else if(L.step==='code'){
    var code=$('#lCode').value.trim();
    if(!/^\d{6}$/.test(code)){L.err='O código tem 6 dígitos.';drawLogin();return}
    L.busy=true;L.err='';drawLogin();
    L.conf.confirm(code).then(function(){/* o resto continua em onAuthStateChanged */}).catch(loginFail);
  }else{
    var n=$('#lName').value.trim();
    if(n.length<1){L.err='Escreve o teu nome.';drawLogin();return}
    if(!S.user){L.err='A sessão terminou. Entra de novo.';drawLogin();return}
    L.busy=true;L.err='';drawLogin();
    setDoc(doc(db,'users',S.user.uid),{name:n,createdAt:serverTimestamp()}).then(function(){S.user.name=n;startListeners();updateHeader();afterAuth()}).catch(function(){L.busy=false;L.err='Não foi possível guardar o nome. Tenta de novo.';drawLogin()});
  }
}
function afterAuth(){
  if(S.user&&S.user.name){
    var f=L.after;L.after=null;
    if(L.open)closeLayer();
    render();
    if(f)f();
  }else if(S.user&&L.open)showLogin('name');
}
function requireAuth(fn){
  if(S.user&&S.user.name){fn();return}
  L.after=fn;L.phoneRaw='';L.signup=false;showLogin(S.user?'name':undefined);
}
function showAccount(){
  if(!(S.user&&S.user.name)){requireAuth(function(){});return}
  var l=$('#layer');
  l.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="A minha conta"><h2>'+esc(S.user.name)+'</h2><p class="muted">'+esc(S.user.ident)+'</p><div class="btnrow"><button class="btn danger" type="button" data-act="logout">Terminar sessão</button><button class="btn" type="button" data-act="closeLayer">Fechar</button></div></div>';
  l.hidden=false;
}
function resetPw(){
  var ei=$('#lEmail');L.email=ei?ei.value.trim():L.email;
  if(!/^\S+@\S+\.\S+$/.test(L.email)){L.err='Escreve primeiro o teu email.';L.info='';drawLogin();return}
  sendPasswordResetEmail(auth,L.email).then(function(){L.err='';L.info='Enviámos um email para repor a palavra-passe. Verifica também a pasta de spam.';drawLogin()}).catch(function(e){L.info='';L.err=authMsg(e);drawLogin()});
}
function doLogout(){closeLayer();signOut(auth).then(function(){toast('Sessão terminada.')})}
function askDelete(id){
  var b=byId(id),l=$('#layer');if(!b)return;
  l.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Apagar negócio"><h2>Apagar '+esc(b.name)+'?</h2><p class="muted">O negócio deixa de aparecer na SpotBiz. Esta ação não pode ser desfeita.</p><div class="btnrow"><button class="btn danger" type="button" data-act="delyes" data-id="'+id+'">Apagar</button><button class="btn" type="button" data-act="closeLayer">Cancelar</button></div></div>';
  l.hidden=false;
}
function doDelete(id){
  closeLayer();
  deleteDoc(doc(db,'businesses',id,'private','contact')).catch(function(){}).then(function(){return deleteDoc(doc(db,'businesses',id))}).then(function(){go('home');toast('Negócio apagado.')}).catch(function(){toast('Não foi possível apagar. Tenta de novo.')});
}
onAuthStateChanged(auth,function(u){
  stopListeners();
  if(!u){
    S.user=null;S.threads={};S.order=[];S.saved=new Set();S.active=null;
    if(S.view==='messages'||S.view==='publish')S.view='home';
    updateHeader();render();return;
  }
  S.user={uid:u.uid,ident:u.phoneNumber||u.email||'',name:''};
  getDoc(doc(db,'users',u.uid)).then(function(s){
    if(!S.user||S.user.uid!==u.uid)return;
    S.user.name=s.exists()?String(s.data().name||''):'';
    if(S.user.name)startListeners();
    updateHeader();afterAuth();if(!L.open)render();
  }).catch(function(){toast('Não foi possível carregar a tua conta. Recarrega a página.')});
});

/* eventos */
document.addEventListener('click',function(e){
  var lay=$('#layer');
  if(e.target===lay){closeLayer();return}
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='go'){var v=el.dataset.v;if(v==='messages'||v==='publish')requireAuth(function(){go(v)});else go(v)}
  else if(a==='open'){var b=byId(id);if(b){S.openId=id;S.view='detail';render();window.scrollTo(0,0)}}
  else if(a==='save')toggleSave(id);
  else if(a==='sector'){S.filters.sector=el.dataset.v;syncFilters();renderGrid()}
  else if(a==='seekf'){S.filters.seek=el.dataset.v;syncFilters();renderGrid()}
  else if(a==='savedf'){S.filters.saved=!S.filters.saved;syncFilters();renderGrid()}
  else if(a==='clear'){S.filters={q:'',sector:'todos',city:'todas',seek:'todos',saved:false,level:1};renderHome()}
  else if(a==='contact')requireAuth(function(){openThread(id+'_'+S.user.uid,id)});
  else if(a==='thread'){S.active=id;renderMessages()}
  else if(a==='threads'){S.active=null;renderMessages()}
  else if(a==='ice'){var i=$('#msgInput');i.value=el.dataset.t;i.focus()}
  else if(a==='copy')copyNum();
  else if(a==='report')showReport(id);
  else if(a==='doReport')doReport(id);
  else if(a==='closeLayer')closeLayer();
  else if(a==='account')showAccount();
  else if(a==='logout')doLogout();
  else if(a==='authtab'){var ei2=$('#lEmail');if(ei2)L.email=ei2.value;L.signup=el.dataset.v==='up';L.err='';L.info='';drawLogin()}
  else if(a==='swapmode'){var ei=$('#lEmail');if(ei)L.email=ei.value;L.signup=!L.signup;L.err='';L.info='';drawLogin()}
  else if(a==='resetpw')resetPw();
  else if(a==='delbiz')askDelete(id);
  else if(a==='delyes')doDelete(id);
  else if(a==='toastact'){var f=toastFn;$('#toast').hidden=true;if(f)f()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='fCity'){S.filters.city=t.value;renderGrid()}
  else if(t.id==='fSort'){S.sort=t.value;renderGrid()}
  else if(t.id==='fLevel'){S.filters.level=Number(t.value);renderGrid()}
  else if(t.closest&&t.closest('#pubForm')){
    if(t.id&&t.id.indexOf('sk-')===0){var k=t.id.slice(3);$('#skf-'+k).hidden=!t.checked}
    readForm();updatePreview();
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){S.filters.q=t.value;renderGrid()}
  else if(t.closest&&t.closest('#pubForm')){
    if(t.id==='pTag')$('#tagCount').textContent=t.value.length+'/90';
    if(t.id==='pAbout')$('#aboutCount').textContent=t.value.length+'/400';
    readForm();updatePreview();
  }
});
document.addEventListener('submit',function(e){
  var id=e.target.id;
  if(id==='searchForm'){e.preventDefault();var r=$('#resultados');if(r)r.scrollIntoView({behavior:'smooth'})}
  else if(id==='pubForm'){e.preventDefault();submitForm()}
  else if(id==='loginForm'){e.preventDefault();submitLogin()}
  else if(id==='composer'){e.preventDefault();var i=$('#msgInput'),v=i.value.trim();if(!v)return;i.value='';sendMsg(v)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#layer').hidden)closeLayer()});

render();
})();
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}

</script>
